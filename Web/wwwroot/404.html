<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>TrackingTasksOp — Página no encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <style>
        .error-page {
            background: radial-gradient(ellipse at 50% 30%, rgba(13, 110, 253, 0.06) 0%, transparent 60%),
                        var(--bs-body-bg);
        }

        .error-code {
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #6ea8fe 0%, #20c997 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -4px;
        }

        .error-card {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.07) !important;
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="error-page d-flex flex-column min-vh-100">

    <nav class="navbar" id="mainNav">
        <div class="container-fluid px-4">
            <a href="/" class="navbar-brand fw-bold fs-5 text-decoration-none">
                <i class="bi bi-clock-history me-2 text-primary"></i>TrackingTasksOp
            </a>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="text-center px-3" style="max-width: 520px;">
            <div class="error-code mb-2">404</div>

            <div class="error-card card border-0 shadow-lg mb-4">
                <div class="card-body p-4">
                    <h1 class="h4 fw-semibold mb-2">
                        <i class="bi bi-compass text-primary me-2"></i>Página no encontrada
                    </h1>
                    <p class="text-muted mb-0">
                        La ruta que buscas no existe o fue movida.<br>
                        Verifica la URL o regresa al inicio.
                    </p>
                </div>
            </div>

            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <a href="/" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house me-2"></i>Ir al inicio
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-arrow-left me-2"></i>Volver atrás
                </button>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted small py-3">
        <span class="opacity-50">DarS Lab &copy; 2026. Todos los derechos reservados.</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
