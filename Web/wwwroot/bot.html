<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackingTasksOp Bot</title>
    <script>
        // Antes de pintar nada: evita el flash de oscuro -> claro al cargar.
        document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('appTheme') || 'dark');
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0d1117;          /* mismo tono que la navbar del sistema */
            --bg-container: #161b22;
            --bg-sidebar: #0d1117;
            --text-main: #e6edf3;
            --text-secondary: #9aa4b2;
            --accent-blue: #0d6efd;      /* primario del sistema */
            --accent-violet: #8b5cf6;    /* mismo violeta que el estado "In testing" */
            --user-msg-bg: #21262d;
            --bot-msg-bg: #161b22;
            --border-color: rgba(255,255,255,.10);
            --hover-bg: rgba(255,255,255,.06);
            --code-bg: #0b0f14;
            --danger: #dc3545;
            --text-strong: #f0f6fc;
            --avatar-user-bg: #30363d;
            --avatar-user-text: #ffffff;
            --code-text: #f1c40f;
            --badge-default-bg: rgba(255,255,255,.06);
            --badge-new: #8ab4ff;
            --badge-progress: #6edff6;
            --badge-developed: #75d69c;
            --badge-testing: #c4b1ff;
            --badge-hold: #ffd75e;
            --badge-closed: #adb5bd;
            --badge-rejected: #ffb066;
            --badge-testfailed: #ff8a95;
        }

        /* Tema claro. Los textos de los badges eran pasteles pensados para fondo oscuro:
           sobre blanco no se leen, asi que cada uno necesita su version oscura. */
        :root[data-bs-theme="light"] {
            --bg-page: #ffffff;
            --bg-container: #f6f8fa;
            --bg-sidebar: #f6f8fa;
            --text-main: #1f2328;
            --text-secondary: #59636e;
            --user-msg-bg: #eaeef2;
            --bot-msg-bg: #f6f8fa;
            --border-color: rgba(0,0,0,.12);
            --hover-bg: rgba(0,0,0,.05);
            --code-bg: #f6f8fa;
            --text-strong: #1f2328;
            --avatar-user-bg: #d0d7de;
            --avatar-user-text: #1f2328;
            --code-text: #953800;
            --badge-default-bg: rgba(0,0,0,.05);
            --badge-new: #0a58ca;
            --badge-progress: #087990;
            --badge-developed: #0f5132;
            --badge-testing: #59359a;
            --badge-hold: #7a5c00;
            --badge-closed: #495057;
            --badge-rejected: #8a4310;
            --badge-testfailed: #b02a37;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-page);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* ── Sidebar ── */
        #sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-top {
            padding: 14px 12px 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 0 4px;
        }

        #new-chat-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        #new-chat-btn:hover { background: var(--hover-bg); }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        #chat-list::-webkit-scrollbar { width: 4px; }
        #chat-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .chat-item {
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            text-align: left;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .chat-item:hover { background: var(--hover-bg); }
        .chat-item.active { background: rgba(13,110,253,.14); }

        .chat-item-info { flex: 1; min-width: 0; }

        .chat-item-title {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .chat-item-date { font-size: 0.72rem; color: var(--text-secondary); }

        .chat-item-del {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .chat-item:hover .chat-item-del { opacity: 1; }
        .chat-item-del:hover { color: var(--danger); }

        .sidebar-footer {
            padding: 10px 12px;
            border-top: 1px solid var(--border-color);
        }

        .nav-back {
            color: var(--accent-blue);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            padding: 6px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }

        .nav-back:hover { background: var(--hover-bg); }

        /* ── Main ── */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .header {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(19,19,20,.85);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .header-title { display: flex; align-items: center; gap: 10px; }

        .header-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1rem; flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.1rem; font-weight: 600;
            background: linear-gradient(90deg, #0d6efd, #8b5cf6, #20c997);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-status { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--text-secondary); margin-top: 1px; }
        .status-online-dot { width: 6px; height: 6px; border-radius: 50%; background: #20c997; }

        #chat-messages {
            flex: 1; padding: 20px 24px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 28px;
            scroll-behavior: smooth;
        }

        #chat-messages::-webkit-scrollbar { width: 6px; }
        #chat-messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 6px; }

        .message-row { display: flex; gap: 14px; animation: fadeIn .25s ease-out; }

        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .avatar.bot { background: linear-gradient(135deg,var(--accent-blue),var(--accent-violet)); color:white; }
        .avatar.user { background: var(--avatar-user-bg); color: var(--avatar-user-text); }

        .message-content { flex:1; line-height:1.7; font-size:.95rem; word-wrap:break-word; }
        .message-content p { margin-bottom:8px; }
        .message-content p:last-child { margin-bottom:0; }
        .message-content strong { font-weight:600; color:var(--text-strong); }

        .message-content ul { list-style:none; margin:6px 0 10px; padding:0; display:flex; flex-direction:column; gap:2px; }
        .message-content ul li { display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; padding:6px 10px; border-radius:8px; transition:background .15s; }
        .message-content ul li:hover { background: var(--hover-bg); }
        .message-content ul li .task-label { flex:1 1 200px; min-width:0; word-break:break-word; }
        .message-content ul li .status-badge { margin-left:auto; }

        .message-content .task-list-title { font-size:.93rem; font-weight:600; color:var(--text-strong); margin:2px 0 8px; }
        .message-content .task-group-header {
            font-size:.72rem; font-weight:600; color:var(--text-secondary);
            text-transform:uppercase; letter-spacing:.06em;
            margin:12px 0 4px; padding-bottom:4px; border-bottom:1px solid var(--border-color);
        }
        .message-content .task-group-header:first-child { margin-top:0; }

        .status-badge { display:inline-flex; align-items:center; gap:5px; flex-shrink:0; font-size:.72rem; font-weight:500; padding:2px 9px; border-radius:999px; white-space:nowrap; }
        .status-badge .status-dot { width:5px; height:5px; border-radius:50%; background:currentColor; }
        .status-badge.status-new       { background:rgba(13,110,253,.18);  color:var(--badge-new); }
        .status-badge.status-progress  { background:rgba(13,202,240,.18);  color:var(--badge-progress); }
        .status-badge.status-developed { background:rgba(25,135,84,.22);   color:var(--badge-developed); }
        .status-badge.status-testing   { background:rgba(139,92,246,.20);  color:var(--badge-testing); }
        .status-badge.status-hold      { background:rgba(255,193,7,.20);   color:var(--badge-hold); }
        .status-badge.status-closed    { background:rgba(108,117,125,.28); color:var(--badge-closed); }
        .status-badge.status-rejected  { background:rgba(253,126,20,.20);  color:var(--badge-rejected); }
        .status-badge.status-testfailed{ background:rgba(220,53,69,.20);   color:var(--badge-testfailed); }
        .status-badge.status-default   { background:var(--badge-default-bg); color:var(--text-secondary); }

        .message-content h4 { font-size:1rem; font-weight:600; margin:12px 0 5px; color:var(--text-strong); }
        .message-content code { font-family:Consolas,monospace; font-size:.83em; background:var(--code-bg); padding:1px 5px; border-radius:4px; color:var(--code-text); }
        .message-content pre { font-family:Consolas,monospace; font-size:.83em; background:var(--code-bg); padding:10px 12px; border-radius:8px; overflow-x:auto; margin:8px 0; }
        .message-content pre code { background:none; padding:0; color:var(--text-main); }

        .message-row:not(.user-row) .message-content { background:var(--bot-msg-bg); border:1px solid var(--border-color); border-radius:14px; padding:12px 16px; }
        .message-row.user-row { flex-direction:row-reverse; }
        .message-row.user-row .message-content { background:var(--user-msg-bg); padding:10px 18px; border-radius:16px; max-width:78%; flex:none; }

        /* Action card */
        .action-card { background:var(--bg-container); border:1px solid var(--border-color); border-radius:10px; padding:14px; margin-top:10px; display:flex; flex-direction:column; gap:10px; max-width:380px; }
        .card-header { display:flex; align-items:center; gap:7px; color:var(--accent-blue); font-weight:600; font-size:.875rem; }
        .card-body { font-size:.92rem; line-height:1.6; }
        .card-footer { display:flex; justify-content:flex-end; }
        .btn-action { background:transparent; border:1px solid var(--border-color); color:var(--accent-blue); padding:5px 11px; border-radius:6px; font-size:.82rem; cursor:pointer; transition:all .15s; }
        .btn-action:hover { background:rgba(13,110,253,.12); border-color:var(--accent-blue); }

        /* Typing */
        .typing-dots { display:flex; gap:4px; padding:6px 0; }
        .dot { width:6px; height:6px; background:var(--accent-blue); border-radius:50%; animation:bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1){animation-delay:-.32s;} .dot:nth-child(2){animation-delay:-.16s;}
        @keyframes bounce { 0%,80%,100%{transform:scale(0);} 40%{transform:scale(1);} }

        /* Input */
        .input-container { padding:0 20px 24px; flex-shrink:0; }

        .suggestions { display:flex; gap:8px; padding:10px 0; overflow-x:auto; scrollbar-width:none; }
        .suggestions::-webkit-scrollbar { display:none; }
        .suggestion-chip { background:transparent; border:1px solid var(--border-color); color:var(--text-secondary); padding:6px 14px; border-radius:16px; font-size:.82rem; font-weight:500; white-space:nowrap; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .15s; }
        .suggestion-chip i { color:var(--accent-blue); font-size:.85rem; }
        .suggestion-chip:hover { background:var(--hover-bg); border-color:var(--text-secondary); }

        .input-wrapper { background:var(--bg-container); border-radius:22px; padding:5px 7px 5px 20px; display:flex; align-items:flex-end; gap:6px; border:1px solid var(--border-color); box-shadow:0 4px 18px rgba(0,0,0,.22); transition:border-color .15s,box-shadow .15s; }
        .input-wrapper:focus-within { border-color:var(--accent-blue); box-shadow:0 4px 18px rgba(0,0,0,.22),0 0 0 3px rgba(13,110,253,.12); }

        #user-input { flex:1; background:transparent; border:none; color:var(--text-main); font-family:inherit; font-size:.95rem; line-height:1.5; padding:11px 0; outline:none; resize:none; overflow-y:auto; max-height:140px; min-height:22px; }
        #user-input::placeholder { color:var(--text-secondary); }
        #user-input::-webkit-scrollbar { width:4px; }
        #user-input::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:4px; }

        #send-btn, #cancel-btn, #mic-btn { border:none; width:40px; height:40px; margin-bottom:3px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s,opacity .15s,transform .1s; }
        #send-btn { background:linear-gradient(135deg,var(--accent-blue),var(--accent-violet)); color:white; }
        #send-btn:active:not(:disabled) { transform:scale(.92); }
        #send-btn:hover:not(:disabled) { opacity:.88; }
        #send-btn:disabled { background:var(--hover-bg); color:var(--text-secondary); opacity:.5; cursor:not-allowed; }
        #cancel-btn { background:rgba(217,101,112,.12); color:var(--danger); }
        #cancel-btn:hover { background:rgba(217,101,112,.2); }
        #mic-btn { background:transparent; color:var(--text-secondary); }
        #mic-btn:hover:not(:disabled) { background:var(--hover-bg); color:var(--text-main); }
        #mic-btn.recording { background:rgba(217,101,112,.15); color:var(--danger); animation:pulse-rec 1.2s infinite; }
        #mic-btn:disabled { color:var(--text-secondary); opacity:.5; cursor:not-allowed; }
        @keyframes pulse-rec { 0%,100%{box-shadow:0 0 0 0 rgba(242,139,130,.4);} 50%{box-shadow:0 0 0 7px rgba(242,139,130,0);} }

        .footer-copyright { text-align:center; font-size:.72rem; color:var(--text-secondary); margin-top:10px; }

        @media (max-width:640px) { #sidebar { display:none; } }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-brand"><i class="bi bi-stars"></i> TrackingTasksOp</div>
            <button id="new-chat-btn"><i class="bi bi-plus-lg"></i> Nuevo chat</button>
        </div>
        <div id="chat-list"></div>
        <div class="sidebar-footer">
            <a href="/" class="nav-back"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        </div>
    </aside>

    <div id="main">
        <div class="header">
            <div class="header-title">
                <div class="header-avatar"><i class="bi bi-stars"></i></div>
                <div>
                    <h1>Asistente</h1>
                    <div class="header-status"><span class="status-online-dot"></span>En línea</div>
                </div>
            </div>
        </div>

        <div id="chat-messages"></div>

        <div class="input-container">
            <div class="suggestions">
                <div class="suggestion-chip"><i class="bi bi-calendar-check"></i> ¿Qué tengo pendiente hoy?</div>
                <div class="suggestion-chip"><i class="bi bi-kanban"></i> Listar proyectos</div>
                <div class="suggestion-chip"><i class="bi bi-flag"></i> Ver estados disponibles</div>
            </div>
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Escribe aquí para chatear..." rows="1" autocomplete="off"></textarea>
                <button id="mic-btn" title="Grabar mensaje de voz"><i class="bi bi-mic-fill fs-6"></i></button>
                <button id="cancel-btn" title="Cancelar petición" style="display:none"><i class="bi bi-stop-circle-fill fs-6"></i></button>
                <button id="send-btn" title="Enviar mensaje"><i class="bi bi-send-fill fs-6"></i></button>
            </div>
            <div class="footer-copyright">
                DarS Lab &copy; 2026. Todos los derechos reservados.<br>
                <a href="/legal.html#horario" class="text-decoration-none" style="color:inherit;">Horario: 7:00–1:00</a><br>
                <a href="/legal.html" class="text-decoration-none" style="color:inherit;">Términos, privacidad y cookies</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth, getCurrentUser } from '/js/auth-guard.js';
        import { fetchTask } from '/js/api.js';
        import { escHtml } from '/js/helpers.js';
        import { getActiveSession, saveSession, clearSession } from '/js/state.js';

        requireAuth();

        const chatMessages = document.getElementById('chat-messages');
        const userInput    = document.getElementById('user-input');
        const sendBtn      = document.getElementById('send-btn');
        const cancelBtn    = document.getElementById('cancel-btn');
        const micBtn       = document.getElementById('mic-btn');
        const chatList     = document.getElementById('chat-list');
        const newChatBtn   = document.getElementById('new-chat-btn');

        // Clave por usuario, no global: una sola clave compartida hacía que el último usuario
        // en abrir el bot en este navegador pisara el "chat actualmente abierto" del anterior
        // (mismo patrón que trackingActiveSession en state.js).
        const CHAT_SESSION_STORAGE_KEY = `chat_session_id:${getCurrentUser()?.userId}`;
        let sessionId = localStorage.getItem(CHAT_SESSION_STORAGE_KEY) || genId();
        localStorage.setItem(CHAT_SESSION_STORAGE_KEY, sessionId);

        let currentAbortController = null;

        function genId() { return 'sess_' + Math.random().toString(36).slice(2, 11); }

        // ── Sidebar ──────────────────────────────────────────────────────────

        function relativeTime(dateStr) {
            const diff = Date.now() - new Date(dateStr).getTime();
            const m = Math.floor(diff / 60000);
            if (m < 1)  return 'ahora';
            if (m < 60) return `hace ${m} min`;
            const h = Math.floor(m / 60);
            if (h < 24) return `hace ${h} h`;
            const d = Math.floor(h / 24);
            return `hace ${d} d`;
        }

        async function loadChats() {
            try {
                const res = await fetch('/api/v1/Bot/chats', { credentials: 'include' });
                if (!res.ok) return;
                const chats = await res.json();
                chatList.innerHTML = '';
                for (const chat of chats) {
                    const btn = document.createElement('button');
                    btn.className = 'chat-item' + (chat.sessionId === sessionId ? ' active' : '');
                    btn.dataset.sid = chat.sessionId;
                    btn.innerHTML = `
                        <div class="chat-item-info">
                            <span class="chat-item-title">${escHtml(chat.title)}</span>
                            <span class="chat-item-date">${relativeTime(chat.lastUpdatedAt)}</span>
                        </div>
                        <button class="chat-item-del" title="Eliminar chat"><i class="bi bi-trash3"></i></button>`;
                    btn.addEventListener('click', () => switchSession(chat.sessionId));
                    btn.querySelector('.chat-item-del').addEventListener('click', async e => {
                        e.stopPropagation();
                        await deleteChat(chat.sessionId);
                    });
                    chatList.appendChild(btn);
                }
            } catch (_) { /* Redis unavailable — silent */ }
        }

        async function switchSession(sid) {
            sessionId = sid;
            localStorage.setItem(CHAT_SESSION_STORAGE_KEY, sid);
            document.querySelectorAll('.chat-item').forEach(el =>
                el.classList.toggle('active', el.dataset.sid === sid));
            chatMessages.innerHTML = '';
            try {
                const res = await fetch(`/api/v1/Bot/chats/${sid}`, { credentials: 'include' });
                if (!res.ok) { showWelcome(); return; }
                const data = await res.json();
                if (!data.messages?.length) { showWelcome(); return; }
                for (const msg of data.messages) addMessage(msg.content, msg.role === 'user');
            } catch (_) { showWelcome(); }
        }

        async function deleteChat(sid) {
            await fetch(`/api/v1/Bot/chats/${sid}`, { method: 'DELETE', credentials: 'include' });
            if (sessionId === sid) newChat();
            await loadChats();
        }

        function newChat() {
            sessionId = genId();
            localStorage.setItem(CHAT_SESSION_STORAGE_KEY, sessionId);
            chatMessages.innerHTML = '';
            showWelcome();
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
        }

        newChatBtn.addEventListener('click', () => { newChat(); loadChats(); });

        // ── Rendering ────────────────────────────────────────────────────────

        function statusBadgeClass(status) {
            const s = (status || '').toLowerCase();
            // Mismo orden de especificidad que statusClass() en /js/helpers.js
            if (/(failed|fallo|fallid)/.test(s))                 return 'status-testfailed';
            if (/(reject|rechaz|cancel)/.test(s))               return 'status-rejected';
            if (/(closed|cerrad|complet|finaliz|done)/.test(s)) return 'status-closed';
            if (/(hold|espera|pausa)/.test(s))                   return 'status-hold';
            if (/(testing|prueba|revis)/.test(s))                return 'status-testing';
            if (/(progress|curso|progreso)/.test(s))             return 'status-progress';
            if (/(develop|desarroll)/.test(s))                   return 'status-developed';
            if (/^new$|^nuevo$/.test(s))                         return 'status-new';
            return 'status-default';
        }

        function formatMarkdown(text) {
            let html = escHtml(text);
            html = html.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trim()}</code></pre>`);
            html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/^### (.*)$/gm, '<h4>$1</h4>');
            html = html.replace(/\*\(Estado: ([^)]+)\)\*/g, (_, status) => {
                const label = status.trim();
                return `<span class="status-badge ${statusBadgeClass(label)}"><span class="status-dot"></span>${label}</span>`;
            });
            html = html.replace(/(?:^|\n)📝 (.*?)(?=\n|$)/g, (_, c) => `\n<div class="task-list-title">📝 ${c}</div>`);
            html = html.replace(/(?:^|\n)📁 (.*?)(?=\n|$)/g, (_, c) => `\n<div class="task-group-header">📁 ${c}</div>`);
            html = html.replace(/(?:^|\n)((?:[*-] .*(?:\n|$))+)/g, (_, list) => {
                const items = list.trim().split('\n').map(line => {
                    const t = line.replace(/^[*-]\s+/, '');
                    const m = t.match(/^(.*?)\s*(<span class="status-badge.*<\/span>)\s*$/);
                    return m
                        ? `<li><span class="task-label">${m[1]}</span>${m[2]}</li>`
                        : `<li><span class="task-label">${t}</span></li>`;
                }).join('');
                return `\n<ul>${items}</ul>`;
            });
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/^(<br>)+/, '');
            html = html.replace(/<br>(<div class="task-(?:list-title|group-header)">|<ul>)/g, '$1');
            html = html.replace(/(<\/div>|<\/ul>)<br>/g, '$1');
            return html;
        }

        function createActionCard(data) {
            if (!data.workPackageId) return '';
            return `<div class="action-card">
                <div class="card-header"><i class="bi bi-check2-circle"></i> Acción Ejecutada</div>
                <div class="card-body">
                    <strong>Tarea:</strong> ${escHtml(data.name || 'Sin nombre')}<br>
                    <strong>ID:</strong> #${data.workPackageId}<br>
                    <span style="color:var(--text-secondary);font-size:.8rem">${escHtml(data.status || '')}</span>
                </div>
                <div class="card-footer">
                    <button class="btn-action" onclick="window.open('http://localhost:8080/work_packages/${data.workPackageId}','_blank')">
                        Ver en OpenProject <i class="bi bi-box-arrow-up-right"></i>
                    </button>
                </div>
            </div>`;
        }

        async function syncSessionFromResponse(text) {
            let match = text.match(/Tarea #(\d+) reanudada/) || text.match(/seguimiento iniciado \(ID:\s*(\d+)\)/);
            if (match) {
                const wpId = parseInt(match[1]);
                try {
                    const task = await fetchTask(wpId);
                    const active = task?.tasksTimeDetails?.find(d => !d.endTime);
                    if (active) saveSession({ workPackageId: wpId, subject: task.name, startTime: active.startTime });
                } catch (_) {}
                return;
            }
            match = text.match(/Tarea #(\d+) pausada/) || text.match(/tarea #(\d+) finalizada/i);
            if (match) {
                const session = getActiveSession();
                if (session && session.workPackageId === parseInt(match[1])) clearSession();
            }
        }

        function addMessage(content, isUser = false) {
            const row = document.createElement('div');
            row.className = `message-row${isUser ? ' user-row' : ''}`;
            const avatar = isUser
                ? '<div class="avatar user"><i class="bi bi-person-fill"></i></div>'
                : '<div class="avatar bot"><i class="bi bi-stars"></i></div>';
            row.innerHTML = `${avatar}<div class="message-content">${isUser ? escHtml(content) : formatMarkdown(content)}</div>`;
            chatMessages.appendChild(row);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return row;
        }

        function addTypingRow() {
            const row = document.createElement('div');
            row.className = 'message-row';
            row.innerHTML = `<div class="avatar bot"><i class="bi bi-stars"></i></div>
                <div class="message-content"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
            chatMessages.appendChild(row);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return row;
        }

        function handleBotResponse(data) {
            const row = addMessage(data.response || 'Operación completada.');
            if (data.metadata) row.querySelector('.message-content').innerHTML += createActionCard(data.metadata);
            if (data.response) syncSessionFromResponse(data.response);
            loadChats();
        }

        function showWelcome() {
            addMessage('¡Hola! Soy tu asistente de TrackingTasksOp. Puedo ayudarte a gestionar tareas en OpenProject, iniciar cronómetros o asignar responsables. ¿Qué deseas hacer hoy?');
        }

        function setInputBusy(busy) {
            userInput.disabled = busy;
            sendBtn.style.display   = busy ? 'none' : 'flex';
            cancelBtn.style.display = busy ? 'flex' : 'none';
            micBtn.disabled = busy;
        }

        function autoResize() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
        }

        userInput.addEventListener('input', autoResize);

        async function sendMessage(text = null) {
            const prompt = text ?? userInput.value.trim();
            if (!prompt) return;
            if (!text) { userInput.value = ''; autoResize(); }
            setInputBusy(true);
            addMessage(prompt, true);
            const typingRow = addTypingRow();
            currentAbortController = new AbortController();
            try {
                const res = await fetch(`/api/v1/Bot/chat/${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Prompt: prompt }),
                    signal: currentAbortController.signal,
                    credentials: 'include'
                });
                if (res.status === 401) {
                    chatMessages.removeChild(typingRow);
                    sessionStorage.removeItem('currentUser');
                    window.location.replace('/auth.html');
                    return;
                }
                const data = await res.json();
                chatMessages.removeChild(typingRow);
                if (!res.ok) { addMessage(`⚠️ ${data.detail || data.title || `Error (${res.status})`}`); return; }
                handleBotResponse(data);
            } catch (err) {
                chatMessages.removeChild(typingRow);
                addMessage(err.name === 'AbortError'
                    ? '🛑 Petición cancelada por el usuario.'
                    : 'Lo siento, no pude conectar con el servidor.');
            } finally {
                currentAbortController = null;
                setInputBusy(false);
                userInput.focus();
            }
        }

        // ── Voz ─────────────────────────────────────────────────────────────
        let mediaRecorder = null, audioChunks = [], isRecording = false;

        async function startRecording() {
            if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
                addMessage('⚠️ Tu navegador no soporta grabación de audio.'); return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    if (blob.size > 0) sendVoice(blob);
                };
                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.querySelector('i').className = 'bi bi-stop-fill fs-6';
                micBtn.title = 'Detener grabación';
            } catch (_) {
                addMessage('⚠️ No se pudo acceder al micrófono. Verifica los permisos.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.querySelector('i').className = 'bi bi-mic-fill fs-6';
            micBtn.title = 'Grabar mensaje de voz';
        }

        async function sendVoice(blob) {
            setInputBusy(true);
            const typingRow = addTypingRow();
            currentAbortController = new AbortController();
            try {
                const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
                const form = new FormData();
                form.append('audio', blob, `audio.${ext}`);
                const res = await fetch(`/api/v1/Bot/voice/${sessionId}`, {
                    method: 'POST', body: form,
                    signal: currentAbortController.signal, credentials: 'include'
                });
                if (res.status === 401) {
                    chatMessages.removeChild(typingRow);
                    sessionStorage.removeItem('currentUser');
                    window.location.replace('/auth.html');
                    return;
                }
                const data = await res.json();
                chatMessages.removeChild(typingRow);
                if (!res.ok) { addMessage(`⚠️ ${data.detail || data.title || `Error (${res.status})`}`); return; }
                if (data.transcript) addMessage(data.transcript, true);
                handleBotResponse(data);
            } catch (err) {
                chatMessages.removeChild(typingRow);
                addMessage(err.name === 'AbortError' ? '🛑 Petición cancelada.' : 'Error al procesar el audio.');
            } finally {
                currentAbortController = null;
                setInputBusy(false);
                userInput.focus();
            }
        }

        micBtn.addEventListener('click', () => isRecording ? stopRecording() : startRecording());
        cancelBtn.addEventListener('click', () => currentAbortController?.abort());
        sendBtn.addEventListener('click', () => sendMessage());
        userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        document.querySelectorAll('.suggestion-chip').forEach(chip =>
            chip.addEventListener('click', () => sendMessage(chip.innerText.trim())));

        // ── Init ─────────────────────────────────────────────────────────────
        showWelcome();
        loadChats();
    </script>
</body>
</html>
