<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>TrackingTasksOp — Conectando...</title>
    <script>
        document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('appTheme') || 'dark');
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="auth-page d-flex flex-column min-vh-100">

    <nav class="navbar" id="mainNav">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold fs-5">
                <i class="bi bi-clock-history me-2 text-primary"></i>TrackingTasksOp
            </span>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="auth-card card border-0 shadow-lg w-100 text-center" style="max-width: 420px;">
            <div class="card-body p-4 p-md-5">
                <div id="callbackLoading">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <p class="text-muted mb-0">Completando inicio de sesión con OpenProject...</p>
                </div>
                <div id="callbackError" class="d-none">
                    <i class="bi bi-exclamation-triangle-fill text-danger display-6 d-block mb-3"></i>
                    <p class="mb-3">No se pudo completar el inicio de sesión.</p>
                    <a href="/auth.html" class="btn btn-primary">Volver a intentar</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/js/oauth-callback.js"></script>
</body>
</html>
