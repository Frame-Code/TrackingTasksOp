# Ambiente de test: el mismo stack de docker-compose.yml + una instancia VACIA de OpenProject
# para probar contra datos desechables antes de tocar produccion.
#
#   docker compose -p trackingtasksop-test \
#     -f docker-compose.yml -f docker-compose.test.yml \
#     --env-file .env.test up -d --build
#
# El "-p" es lo unico que separa test de produccion: cambia el nombre del proyecto Compose,
# asi que los contenedores, la red y sobre todo los VOLUMENES son otros. Nunca levantar este
# archivo sin "-p": pisaria los contenedores de produccion con la config de test.
#
# Los puertos del host los define .env.test (APP_PORT/PG_PORT/OP_PORT) para no chocar con
# el stack de produccion, que corre en los valores por defecto (5000/5432).
services:
  openproject:
    # Imagen all-in-one: si no se le pasa DATABASE_URL arranca su propio PostgreSQL y su
    # memcached dentro del contenedor. Es mas pesada, pero para un test desechable evita
    # mantener tres servicios mas aca.
    # Pinneada a proposito: el test solo sirve si corre la MISMA version mayor que la
    # instancia real contra la que se usa la app. Cambiar el tag si esa version es otra.
    image: openproject/openproject:15
    restart: always
    environment:
      # Obligatoria; cualquier cadena larga sirve. Si cambia, se invalidan las sesiones.
      OPENPROJECT_SECRET__KEY__BASE: "${OP_SECRET_KEY_BASE}"
      # Debe coincidir con como se llega desde el navegador, o OpenProject rechaza el host.
      # Por tunel SSH alcanza el default; publicado con "tailscale serve" hay que ponerle el
      # nombre del tailnet con su puerto (ver .env.test.example).
      OPENPROJECT_HOST__NAME: "${OP_HOST_NAME:-localhost:${OP_PORT:-8081}}"
      # Con "false" genera links http://. Detras de "tailscale serve", que termina TLS, tiene
      # que ser "true" o los redirects sacan al navegador del HTTPS.
      OPENPROJECT_HTTPS: "${OP_HTTPS:-false}"
      # Desde OpenProject 14.3 se valida el header Host y se responde 400 a todo lo que no sea
      # OPENPROJECT_HOST__NAME. La app le habla por la red de Compose, o sea con Host "openproject",
      # que nunca es el host publico: sin esta linea el registro falla con "No se pudo conectar
      # a OpenProject en http://openproject".
      # La comparacion incluye el puerto (por eso el navegador pasa: manda exactamente el
      # host:puerto de OPENPROJECT_HOST__NAME), asi que hay que listar cada forma con la que
      # la app puede llegar, no solo el nombre pelado.
      OPENPROJECT_ADDITIONAL__HOST__NAMES: '["openproject","openproject:8080","openproject:80"]'
      OPENPROJECT_DEFAULT__LANGUAGE: "es"
      TZ: "${TZ:-America/Guayaquil}"
    ports:
      # Loopback, igual que todo lo demas: se llega por tunel SSH o tailscale serve.
      - "127.0.0.1:${OP_PORT:-8081}:80"
    volumes:
      - opdata:/var/openproject/assets
      - oppgdata:/var/openproject/pgdata
    # El primer arranque corre las migraciones de OpenProject y tarda varios minutos.
    # Con menos de ~2g la imagen all-in-one se queda sin memoria a mitad de seed.
    mem_limit: 3g

  app:
    depends_on:
      - openproject
    environment:
      # La app registra la instancia por la red interna de Compose: http://openproject
      #
      # Eso exige apagar SsrfSafeHttpHandler, que bloquea 172.16/12 — justo donde vive la red
      # de Compose. Program.cs lo ata a IsDevelopment(), asi que este es el interruptor.
      #
      # El plan anterior era que la app entrara por la MISMA URL publica del tailnet que usa el
      # navegador, para no apagar el filtro. No funciona en esta maquina: Tailscale pone en la
      # cadena "ts-input" un DROP para todo lo que llegue a 100.64.0.0/10 por una interfaz que
      # no sea tailscale0, o sea que el bridge de Docker nunca alcanza 100.x:8082 y el registro
      # moria con "Timeout al conectar a OpenProject". Comprobado: curl desde el host da 302,
      # el mismo curl desde un contenedor de esta red da timeout.
      # Abrir esa regla pedia sudo MAS una unidad de systemd que la reinyecte en cada arranque
      # de tailscaled (que reconstruye la cadena), para sostener un salto que produccion ni
      # siquiera hace: alli cada usuario registra su instancia externa y se llega por internet.
      #
      # Lo que test deja de ejercitar con esto: el filtro SSRF, y nada mas. Program.cs solo
      # consulta IsDevelopment() en dos puntos — ese filtro y habilitar Swagger. No existe
      # appsettings.Development.json, asi que no hay deriva de configuracion, y
      # GlobalExceptionHandler + ProblemDetails estan registrados siempre, asi que tampoco
      # aparecen paginas de error con stack traces.
      ASPNETCORE_ENVIRONMENT: "Development"

volumes:
  opdata:
  oppgdata:
