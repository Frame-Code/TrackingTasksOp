services:
  app:
    build: .
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      # Solo loopback: la app no escucha en ninguna interfaz de red. El unico camino de
      # entrada es "tailscale serve", que exige identidad del tailnet. Desde el host sin
      # Tailscale: ssh -L 5000:localhost:5000 al server.
      - "127.0.0.1:5000:8080"
    environment:
      ConnectionStrings__TrackingTasks: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RedisSettings__Configuration: "redis:6379,password=${REDIS_PASSWORD}"
      # El arranque exige una key global aunque cada usuario cargue la suya después.
      AIModel__Groq__ApiKey: "${GROQ_API_KEY}"
      # La cookie de sesion solo viaja cifrada. Vale porque el unico camino de entrada es
      # "tailscale serve", que termina TLS en la maquina; si algun dia se sirve por HTTP
      # plano, el navegador dejaria de mandarla y nadie podria entrar.
      CookieSettings__UseSecurePolicy: "true"
      # Reloj de pared del equipo. Sin esto el contenedor corre en UTC y las sesiones quedan
      # con horas corridas respecto del reloj del usuario.
      TZ: "${TZ:-America/Guayaquil}"
      # El key ring ahora vive en la base (tabla DataProtectionKeys), no en disco: se respalda
      # junto con los datos que descifra y ya no puede quedar desincronizado por un pg_dump.
      # Para ademas cifrarlo y que un dump filtrado no exponga las API keys, generar el .pfx
      # (ver Docs/DataProtection.md), descomentar estas dos lineas y el volumen de abajo.
      # OJO: si se pierde el .pfx, el ring queda ilegible — respaldarlo una vez, fuera del dump.
      # DataProtectionSettings__KeyRingCertificatePath: /keys/keyring.pfx
      # DataProtectionSettings__KeyRingCertificatePassword: "${KEYRING_CERT_PASSWORD}"
      # Para servir HTTPS con el .pfx propio (LAN, sin Let's Encrypt), descomentar esto,
      # montar el certificado y publicar el 8081:
      # ASPNETCORE_Kestrel__Certificates__Default__Path: /https/cert.pfx
      # ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD}
      # ASPNETCORE_HTTPS_PORTS: 8081
    # Sin volumenes: el key ring ya no va en disco, vive en la tabla DataProtectionKeys de
    # Postgres. Para montar el .pfx que lo cifra (o el de HTTPS), reponer aqui:
    # volumes:
    #   - ./Deploy/keyring.pfx:/keys/keyring.pfx:ro
    #   - ./Deploy/cert.pfx:/https/cert.pfx:ro
    mem_limit: 512m

  postgres:
    image: postgres:17-alpine
    ports:
      # Solo loopback: no queda expuesto a ninguna red. Para conectar un cliente (DBeaver),
      # se llega por tunel SSH, que ya exige clave y estar en el tailnet.
      - "127.0.0.1:5432:5432"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    # Sin ports publicados: la app le habla por la red interna de compose. Exponerlo no le
    # servia a nadie y lo dejaba al alcance de cualquiera que llegara a la maquina.
    restart: always
    volumes:
      - redisdata:/data
    mem_limit: 512m
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru

volumes:
  redisdata:
  pgdata:
