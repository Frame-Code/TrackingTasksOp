version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    mem_limit: 512m
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru

volumes:
  redisdata: